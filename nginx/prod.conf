user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include /etc/nginx/snippets/http.conf;

    # Certificates come from fetch-certs.sh, mounted from ./certs by docker-compose.yml.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Redirect all HTTP to HTTPS
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://tfagames.tech$request_uri;
    }

    # Redirect www to the bare domain
    server {
        listen 443 ssl;
        http2 on;
        server_name www.tfagames.tech;
        return 301 https://tfagames.tech$request_uri;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name tfagames.tech;

        include /etc/nginx/snippets/site.conf;
    }
}
