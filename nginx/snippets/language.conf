# Picks the site language from the visitor's preferred (first) Accept-Language entry.
# Regexes are tried in order and the first match wins. Keep the targets in sync with src/locales
# (build.mjs checks this).
map $http_accept_language $site_lang {
    default                    en;
    "~*^es-es\b"               es;
    "~*^es-"                   es-419;
    "~*^es\b"                  es;
    "~*^pt\b"                  pt-BR;
    "~*^zh-(hant|tw|hk|mo)\b"  zh-Hant;
    "~*^fr\b"                  fr;
    "~*^de\b"                  de;
    "~*^it\b"                  it;
    "~*^nl\b"                  nl;
    "~*^ja\b"                  ja;
    "~*^ko\b"                  ko;
    "~*^uk\b"                  uk;
}
