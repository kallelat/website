# Shared http-level settings for the dev and prod configs.

include       /etc/nginx/mime.types;
default_type  application/octet-stream;
charset       utf-8;
charset_types text/css;
sendfile      on;
keepalive_timeout 65;
server_tokens off;

# Relative Location headers, so redirects work on any host and port (e.g. localhost:8080 in dev).
absolute_redirect off;

# No IP addresses, referrers or user agents: the privacy policy promises this.
log_format privacy '[$time_local] $status "$request" $body_bytes_sent';
access_log /var/log/nginx/access.log privacy;

gzip on;
gzip_types text/css image/svg+xml;

include /etc/nginx/snippets/language.conf;
