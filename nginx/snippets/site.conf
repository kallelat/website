# The site itself, shared by the dev and prod server blocks.

root  /usr/share/nginx/html;
index index.html;
error_page 404 /404.html;

include /etc/nginx/snippets/headers.conf;

# Root: send the visitor to their language. 302, since the target depends on the browser.
location = / {
    include /etc/nginx/snippets/headers.conf;
    add_header Vary "Accept-Language" always;
    add_header Cache-Control "no-cache" always;
    return 302 /$site_lang/;
}

location /assets/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
}

location = /favicon.ico {
    access_log off;
    log_not_found off;
    return 204;
}

# /de → /de/ (nginx adds the slash for directories), /de/ → /de/index.html, anything else → 404.
location / {
    try_files $uri $uri/ =404;
}
